# Milestone M4 epic registration payload (issue #468, ADR-020 sections 7 and 9).
# Consumed by tools/github/register-milestone-epics.py. Field names follow the
# canonical workflow contract: subject / blocked_by (never title / depends_on).
# Cross-repo children are filed in their owning repo and cross-referenced from
# the epic body (ADR-020 section 6 per-repo epics; dispatch packets carry repo).
milestone: M4
title: "M4 Epic: full-pipeline dogfood (ADR-020)"
epic_home: Odysseus
workflow: workflows/m4-full-pipeline-dogfood.yaml
home_rationale: >-
  Odysseus is the coordination hub for ecosystem-wide dogfooding; the repo
  that owns most of the milestone's work hosts the epic.
ordering_note: >-
  Follows M1 then M2 then M3 per the ADR-020 section 9 ladder.
children:
  - id: M4.1
    repo: Odysseus
    subject: Requirements and invariants for dogfooded operation
    description: >-
      Capture: every milestone epic from here on is worked BY the mesh
      (fallback to single-device loop per issue is allowed and must be
      recorded as a comment marker); CI evidence rules per ADR-014 apply to
      all mesh-produced PRs; legacy claude-myrmidon harness migrates or
      retires; cross-host hermes-hub to epimetheus check included.
    blocked_by: []
  - id: M4.2
    repo: Odysseus
    subject: Runbook docs/runbooks/operate-mesh-loop.md
    description: >-
      Numbered, executable runbook for operating the mesh loop top-to-bottom
      without prior context (AGENTS.md runbook convention).
    blocked_by: [M4.1]
  - id: M4.3
    repo: Odysseus
    subject: Select and track first real dogfood backlog issue
    description: >-
      Select the first real HomericIntelligence backlog issue to be merged
      with the mesh only and track it as the M4 exit-criterion dogfood target.
    blocked_by: [M4.1]
  - id: M4.4
    repo: Proteus
    subject: Vessel CI build/push on Hephaestus merges plus agamemnon-apply dispatch
    description: >-
      Proteus builds and pushes both mesh vessel variants on Hephaestus
      merges, then triggers agamemnon-apply so the fleet reconciles.
    blocked_by: [M4.1]
  - id: M4.5
    repo: Hermes
    subject: Hermes merged-PR webhook bridge publishing the learn trigger
    description: >-
      Bridge GitHub PR-merged webhooks into hi.pipeline so athena:learn runs
      post-merge per ADR-020 section 8.
    blocked_by: [M4.1]
  - id: M4.6
    repo: Argus
    subject: Stage-latency budget-exhaustion merger-bounce dashboards
    description: >-
      Argus dashboards for stage latency, budget exhaustion, and merger
      bounce during mesh-driven operation.
    blocked_by: [M4.1]
  - id: M4.7
    repo: Hephaestus
    subject: Single-device entry-point deprecation note
    description: >-
      Deprecation note for the single-device hephaestus-automation-loop entry
      point once mesh parity is reached; both modes share labels and journal
      per ADR-020 section 9 fallback strategy.
    blocked_by: [M4.1]
