# Dependabot configuration — HomericIntelligence fleet baseline
# Cadence: monthly. Grouping: minor+patch updates in one PR, major-version
# bumps in their own PR for focused review. See the Dependabot options
# reference for details.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: 'chore(ci)'
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: 'gitsubmodule'
    directory: '/'
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "submodules"
    commit-message:
      prefix: 'chore(submodules)'
