# Milestone workflow registry — mesh-distributed Hephaestus loop (ADR-020).
#
# Each file defines one milestone as requirements/goals/invariants/research
# plus a planner sub-agent step that performs the epic decomposition with
# contextual Athena advice when available. Telemachy executes the workflow; it
# never plans.
#
# Run (from provisioning/Telemachy so pixi resolves the telemachy env;
# paths resolve against CWD, WORKFLOWS_DIR is not consulted for lookup):
#   cd provisioning/Telemachy
#   pixi run telemachy validate ../../workflows/m0-contracts.yaml   # schema check
#   pixi run telemachy run      ../../workflows/m0-contracts.yaml   # execute
#
# Epics are registered PER REPO (epic_home in metadata); child issues are
# the dispatchable units. Field names follow the canonical YAML contract:
# subject / blocked_by / assign_to (never title / depends_on).

apiVersion: telemachy/v1
metadata:
  name: m0-mesh-loop-contracts
  description: >-
    Milestone 0 — contracts: Proposed ADR-020 design review,
    envelope/budget compatibility recording, lane/default preservation,
    retained-role assessment, and authoring of the M1-M6 milestone
    workflows.
  adr: "020"
  epic_home: Odysseus
  lane_models: configs/lane-models.yaml
agents:
  - name: loop-planner
    program: claude-code
    working_dir: /tmp/m0-planner
    runtime: local
teams:
  - name: m0-contracts
    agents: [loop-planner]
    tasks:
      - subject: Assess lane model compatibility without changing defaults
        description: >-
          Inventory the currently selected planning, implementation, review,
          and mechanical lane model/provider fields and record compatibility
          gaps as Proposed ADR-020 follow-up work. Do not edit a model pin,
          provider, role, lane, manifest default, or desired state. Output only
          a source-backed assessment and separately scoped proposed changes.
        assign_to: loop-planner
      - subject: Record dispatch envelope and budget-carriage compatibility
        description: >-
          Record the checked-in ADR-013 pointer-envelope field shape for stage
          chaining: stage, attempt, budget counters, verdict, and remediation
          payload. Treat the current hi/v1 schema as structural compatibility
          evidence only. Record retry-counter and exhaustion semantics as
          Proposed ADR-020 behavior, not accepted or deployed behavior. Do not
          change wire fields or defaults. blocked_by: lane assessment is
          independent; the compatibility record blocks M1 implementation
          issues.
        assign_to: loop-planner
        blocked_by: []
      - subject: Assess retained nine-role topology and consumer migrations
        description: >-
          Inventory consumers of the nine retained Odyssey roles named by the
          modernization plan and identify migrations required before overlapping
          roles can be removed. Treat ADR-020's older 30-role hierarchy text as
          Proposed historical design, not a canonical import instruction. Do
          not change roles, hierarchy manifests, dispatch names, or defaults.
          blocked_by: none.
        assign_to: loop-planner
        blocked_by: []
      - subject: Plan M1-M6 epics with contextual advice
        description: >-
          Request relevant athena:advise context before decomposing and record
          whether it was fresh, stale, unavailable, or unverifiable. Produce
          the per-repo epic breakdowns for milestones 1 through 6 with child
          issues sized to single dispatchable tasks. Requirements, goals,
          invariants, and research come from this workflow's sibling tasks and
          ADR-020. Advice informs the plan but does not veto otherwise
          authorized work when it is missing, stale, or unverifiable.
        assign_to: loop-planner
        blocked_by:
          - Assess lane model compatibility without changing defaults
          - Record dispatch envelope and budget-carriage compatibility
          - Assess retained nine-role topology and consumer migrations
teardown: on_completion
