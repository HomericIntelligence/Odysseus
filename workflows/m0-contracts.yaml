# Milestone workflow registry — mesh-distributed Hephaestus loop (ADR-020).
#
# Each file defines one milestone and its canonical authored task descriptions.
# The milestone issue registrar reads those descriptions from the workflow.
# Telemachy executes a workflow; it does not create a second task plan.
#
# Run (from provisioning/Telemachy so pixi resolves the telemachy env;
# paths resolve against CWD, WORKFLOWS_DIR is not consulted for lookup):
#   cd provisioning/Telemachy
#   pixi run telemachy validate ../../workflows/m0-contracts.yaml   # schema check
#   pixi run telemachy run      ../../workflows/m0-contracts.yaml   # execute
#
# Epics are registered PER REPO (epic_home in metadata); child issues are
# the dispatchable units. Field names follow the canonical YAML contract:
# subject / blocked_by / assign_to (never title / depends_on).

apiVersion: telemachy/v1
metadata:
  name: m0-mesh-loop-contracts
  description: >-
    Milestone 0 — contracts: verify the existing hi/v1 envelope and budget
    fields against current schemas, verify lane-model pins, define the Odyssey
    retained-role migration boundary, and author the M1-M6 milestone
    workflows. Proposed ADR-020 supplies target-state context; it is not
    activation authority for its broader hierarchy proposal.
  adr: "020"
  epic_home: Odysseus
  lane_models: configs/lane-models.yaml
agents:
  - name: loop-planner
    program: claude-code
    working_dir: /tmp/m0-planner
    runtime: local
teams:
  - name: m0-contracts
    agents: [loop-planner]
    tasks:
      - subject: >-
          Verify planning / implementation / review / mechanical lane model IDs
        description: >-
          Verify the four operator-confirmed lane model IDs (planning,
          implementation, review, mechanical) against configs/lane-models.yaml
          and their current consumers. Do not select, replace, or propagate a
          different model, and do not change role, lane, or provider defaults.
          Report any mismatch truthfully and stop for separately scoped
          authority. Complete when a read-only comparison and focused config
          validation confirm all four exact IDs. Blocks everything downstream.
        assign_to: loop-planner
      - subject: Record dispatch envelope and budget-carriage compatibility
        description: >-
          Verify that the existing hi/v1 pointer envelope carries the current
          stage-chaining fields: stage, attempt, budget counters, verdict, and
          remediation payload. Treat the checked-in schema as the preserved
          contract: do not edit hi/v1 fields or transport semantics. Schema
          compatibility does not establish deployed retry or exhaustion
          behavior; those semantics remain Proposed ADR-020 targets. Any wire
          change requires a separately scoped, newly versioned schema and
          compatible consumer plan. Change only validation examples, tests, or
          references needed to prove the current contract. Complete when valid
          examples pass, malformed envelopes fail, every worker reference
          resolves, and the hi/v1 schema remains byte-unchanged. Lane pinning
          is independent; this verification blocks M1 implementation issues.
        assign_to: loop-planner
        blocked_by: []
      - subject: Define the retained Odyssey agent-role migration boundary
        description: >-
          Bind the live consumers of Odyssey's nine retained instruction
          roles: chief-architect, implementation-engineer,
          ci-failure-analyzer, code-review-orchestrator,
          general-review-specialist, mojo-language-review-specialist,
          numerical-stability-specialist, security-review-specialist, and
          test-review-specialist. Map each consumer to one retained role or a
          classified removal; do not import the former full hierarchy into
          Myrmidons or create runtime roles from an instruction catalog.
          Change only the role-consumer inventory, focused validation, and
          tracking issue; preserve runtime role, model, and provider defaults.
          Complete when all live consumers are classified and a fixture with
          a removed or surplus role fails the check.
        assign_to: loop-planner
        blocked_by: []
      - subject: Plan M1-M6 epics with contextual skill selection
        description: >-
          Select athena:advise only when its planning trigger matches the work;
          any retrieved guidance yields to the approved scope and authority.
          Treat the checked-in M1-M6 workflow tasks as the canonical authored
          descriptions and render per-repo epics from them. This workflow's
          sibling tasks and Proposed ADR-020 supply context. Change only
          workflow task content, routing metadata, and explicitly authorized
          issue registration; do not rewrite closed issue bodies or change task
          wire fields. Complete when plan mode validates six epics, one-to-one
          task routing, dependency parity, and single-dispatchable-task issue
          output, with the contextual skill-selection decision recorded.
        assign_to: loop-planner
        blocked_by:
          - Verify planning / implementation / review / mechanical lane model IDs
          - Record dispatch envelope and budget-carriage compatibility
          - Define the retained Odyssey agent-role migration boundary
teardown: on_completion
