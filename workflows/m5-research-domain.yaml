# Milestone 5 — research domain: Nestor intake through epic handoff.
# Epic home: Nestor. See ADR-013 sections 5-7 and ADR-020 stage map.

apiVersion: telemachy/v1
metadata:
  name: m5-research-domain
  description: >-
    Wire the research half of ADR-013: POST /v1/research intake dispatches to
    hi.myrmidon.research.chief-architect, research myrmidons interview via
    the relay subjects, Telemachy registers the resulting epic with child
    issues that enter the loop. Exit: idea to researched brief to registered
    epic to merged work without manual steps.
  adr: "020"
  epic_home: Nestor
agents:
  - name: loop-planner
    program: claude-code
    working_dir: /tmp/m5-planner
    runtime: local
teams:
  - name: m5-research
    agents: [loop-planner]
    tasks:
      - subject: Requirements and invariants for the research lane
        description: >-
          Capture: LLM work never runs inside C++ services (Nestor stays
          thin); interview fallback ladder live console then GitHub comment
          marker polling then assumptions recorded; research dispatch adds
          inline idea/context fields; completion closes the Nestor store
          item; handoff produces a researched brief consumed by the epic
          planner with athena:advise gate.
        assign_to: loop-planner
      - subject: Plan research-lane decomposition (advise-gated)
        description: >-
          Run athena:advise planning mode first. Decompose into child issues:
          Nestor dispatch payload conformance; research myrmidon manifest on
          the achaean-mesh vessel; interview relay consumer in the console;
          brief-to-Telemachy handoff workflow; E2E case from submitted idea
          to registered epic entering M4-style dogfood.
        assign_to: loop-planner
        blocked_by:
          - Requirements and invariants for the research lane
teardown: on_completion
