# Milestone 4 — full pipeline dogfood across the ecosystem.
# Epic home: Odysseus (coordination hub). See Proposed ADR-020 section 9 step M4.

apiVersion: telemachy/v1
metadata:
  name: m4-full-pipeline-dogfood
  description: >-
    Mesh drives real HomericIntelligence backlog end to end. Proteus builds
    and pushes both mesh vessel variants on Hephaestus merges; Hermes bridges
    PR merged webhooks into hi.pipeline to trigger learn. Exit: at least one
    real issue merged with the mesh only; single-device loop idle.
  adr: "020"
  epic_home: Odysseus
agents:
  - name: loop-planner
    program: claude-code
    working_dir: /tmp/m4-planner
    runtime: local
teams:
  - name: m4-dogfood
    agents: [loop-planner]
    tasks:
      - subject: Requirements and invariants for dogfooded operation
        description: >-
          Capture: every milestone epic from here on is worked BY the mesh
          (fallback to the supported single-device loop per issue is allowed
          and must be recorded as a comment marker); every mesh-produced PR
          must satisfy its owning repository's binding policies and retained
          CI gates, while Proposed ADR-014 records broader evidence-integrity
          rationale; both legacy myrmidon harnesses remain live through
          exact-pin parity and one real M4 dogfood run, with retirement
          reserved for a later, separate human-reviewed change; cross-host
          hermes-hub to epimetheus check included.
        assign_to: loop-planner
      - subject: Plan rollout decomposition (advise-gated)
        description: >-
          Run athena:advise planning mode first. Decompose into child issues:
          Proteus vessel CI plus agamemnon-apply dispatch; Hermes merged
          webhook bridge publishing the learn trigger; Argus stage-latency,
          budget-exhaustion, merger-bounce dashboards; runbook
          operate-mesh-loop.md; documentation for the supported single-device
          fallback and explicit mode selection; first real backlog issue
          selected as dogfood target; an operator-held completion gate that
          verifies M4.2 through M4.7 at their merged, green, exact pins before
          exact-pin mesh-only execution with truthful terminal receipts. A
          missing prerequisite or failed run is recorded but keeps the gate,
          M4, and legacy retirement blocked; only a successful mesh-only merge
          closes M4.
        assign_to: loop-planner
        blocked_by:
          - Requirements and invariants for dogfooded operation
teardown: on_completion
