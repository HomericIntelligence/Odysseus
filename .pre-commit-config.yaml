default_install_hook_types: [pre-commit, pre-push]

# Pre-commit hooks for the Odysseus meta-repo.
#
# The silent-failure hook below enforces the tracked policy in
# docs/runbooks/no-silent-failures.md. It rejects executable failure
# suppression without interpreting authored YAML prose as shell code.

repos:
  - repo: local
    hooks:
      - id: forbid-or-true
        name: "forbid silent-failure controls in staged executable commands"
        description: >
          Structurally checks GitHub Actions run commands and control fields,
          parses staged shell source as shell syntax, and checks executable
          Dockerfile, justfile, and HCL command lines. Refactor to an explicit
          guard or conditional. See
          docs/runbooks/no-silent-failures.md.
        language: system
        entry: >-
          /bin/sh -c 'case "${ODYSSEUS_TRUSTED_POLICY_ROOT-}" in
          "") test "${ODYSSEUS_MANAGED_PRE_COMMIT-}" = 1 || exit 78;
          exec "${ODYSSEUS_PRE_COMMIT_INTERPRETER:?}" -I -S -c
          '"'"'import hashlib,os,stat; path=os.environ["ODYSSEUS_PRE_COMMIT_POLICY_PATH"]; os.path.isabs(path) and not os.environ.get("ODYSSEUS_PRE_COMMIT_POLICY_HEX") or (_ for _ in ()).throw(SystemExit(78)); fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK); stat.S_ISREG(os.fstat(fd).st_mode) or (_ for _ in ()).throw(SystemExit(78)); stream=os.fdopen(fd,"rb"); source=stream.read(64*1024*1024+1); stream.close(); len(source)<=64*1024*1024 or (_ for _ in ()).throw(SystemExit(78)); expected=os.environ["ODYSSEUS_PRE_COMMIT_POLICY_SHA256"]; hashlib.sha256(source).hexdigest()==expected or (_ for _ in ()).throw(SystemExit(78)); exec(compile(source,"<odysseus-trusted-policy>","exec"),{"__name__":"__main__","__file__":"<odysseus-trusted-policy>"})'"'"'
          "$@" ;;
          /run/trusted-policy) exec /usr/local/bin/python3 -I -S
          /run/trusted-policy/scripts/check_silent_failures.py "$@" ;;
          *) echo "untrusted policy root" >&2; exit 78 ;; esac' --
        files: '(^\.github/workflows/.*\.ya?ml$|\.(sh|bash|hcl)$|(^|/)Dockerfile[^/]*$|(^|/)[Jj]ustfile$)'
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: forbid-merge-conflict-markers
        name: "forbid unresolved merge-conflict markers in tracked source"
        description: >
          Rejects `<<<<<<<`, `=======`, `>>>>>>>` markers in each staged
          first-party text file.
          Regression guard for the 0651c1c corruption on chore/split-hephaestus-athena
          where conflict-marker block content was committed into 4 files because
          pre-commit hooks (this one did not exist yet) had nothing to detect it.
          Scope: tracked first-party source only - skips submodule working trees
          (their own repos' hooks gate their commits) per AGENTS.md.
        language: pygrep
        entry: '^(?!\\s*#)(<<<<<<<[^<]|=======$|>>>>>>>[^<])'
        exclude: '^(agentic/|control/|infrastructure/|provisioning/|ci-cd/|research/|shared/|testing/)'
        types: [text]
        pass_filenames: true

      - id: check-grafana-credentials
        name: "Grafana default-cred rotation warning + anonymous-read marker (#179)"
        description: >
          Default Grafana creds documented in tracked *.md must carry an adjacent
          rotation warning, and anonymous Grafana access must be explicitly
          marked e2e-only within two lines above. Scoped to this repo's tracked
          files (git ls-files); submodules are never scanned. See #179.
        language: system
        entry: python3 -I scripts/check_grafana_credentials.py
        pass_filenames: false
        always_run: true
      - id: version-consistency-check
        name: version-consistency-check
        entry: python3 scripts/check_version_consistency.py
        language: system
        files: ^(pixi\.toml|CHANGELOG\.md)$
        pass_filenames: false
